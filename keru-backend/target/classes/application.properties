# ============================================================
# KERU SISTEMA - application.properties
# ============================================================
spring.application.name=keru-sistema
server.port=8080
server.servlet.context-path=/api

# ------------------------------------------------------------
# SQL SERVER EXPRESS
# Cambia TU_PASSWORD_AQUI por tu contraseña del usuario sa
# ------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=InventarioDTI_2026;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Archivos - Excel e imágenes de firma (max 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ------------------------------------------------------------
# RUTAS DE ARCHIVOS EN EL SERVIDOR
# Cambia estas rutas según tu entorno Windows
# ------------------------------------------------------------
keru.storage.actas-pdf=C:/keru-storage/actas-pdf
keru.storage.actas-firmadas=C:/keru-storage/actas-firmadas
keru.storage.url-base=http://localhost:8080/api/files

# CORS
keru.cors.allowed-origins=http://localhost:8080,http://localhost:63342

# Logging
logging.level.com.dti.keru=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n

# ──────────────────────────────────────────────────────────────
# OPTIMIZACIONES DE PERFORMANCE
# ──────────────────────────────────────────────────────────────

# Batch fetching: si Hibernate necesita cargar N entidades lazy,
# las trae en grupos de 20 en vez de N queries individuales
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Pool de conexiones optimizado para servidor interno
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Cache de segundo nivel (reduce queries repetidas al dashboard)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Estadísticas de queries en log (activar solo para debug)
spring.jpa.properties.hibernate.generate_statistics=false
